<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self'; script-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DSH Desktop</title>
    <link rel="stylesheet" href="./shell.css" />
  </head>
  <body>
    <header class="workspace-bar">
      <div class="brand" aria-label="DSH Desktop">
        <span class="brand-mark" aria-hidden="true">DSH</span>
        <span class="brand-name">Workspace</span>
      </div>
      <nav class="tabs" aria-label="工作区">
        <button class="tab is-active" type="button" data-tab="deepseek" aria-selected="true">
          <span class="tab-dot deepseek-dot" aria-hidden="true"></span>
          DeepSeek 网页对话
          <span class="tab-badge">官网</span>
        </button>
        <button class="tab" type="button" data-tab="dsh" aria-selected="false">
          <span class="tab-dot dsh-dot" aria-hidden="true"></span>
          DSH 工作区
          <span class="tab-badge">本地</span>
        </button>
      </nav>
      <div class="status-area" role="status">
        <div id="state" class="state is-loading">正在连接 DeepSeek…</div>
        <div id="dsh-status" class="dsh-status" hidden></div>
        <span id="update-status" class="update-status" hidden>DSH 新版本可用</span>
        <button id="restart-dsh" class="restart-button" type="button" hidden>重启 DSH</button>
      </div>
    </header>
    <script type="module" src="./shell.ts"></script>
  </body>
</html>
