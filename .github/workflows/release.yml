name: Release Windows Desktop

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install desktop dependencies
        run: npm ci

      - name: Verify source
        run: |
          npm run typecheck
          npm test

      - name: Build Windows installer
        run: npm run release:github

      - name: Create GitHub Release with the product design document
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "dist/DSH-Desktop-${VERSION}-Setup.exe" \
            "dist/DSH-Desktop-${VERSION}-Setup.exe.blockmap" \
            dist/latest.yml \
            docs/superpowers/specs/2026-08-16-dsh-desktop-v0.2-design.md \
            --repo "$GITHUB_REPOSITORY" \
            --notes-file docs/superpowers/specs/2026-08-16-dsh-desktop-v0.2-design.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
